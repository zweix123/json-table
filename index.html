<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON 表格</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #263449; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    h1 { flex-shrink: 0; margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.5px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border: 0; border-radius: 6px; background: #285cce; color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    button:hover { background: #214eaf; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, .table-wrap:focus-visible { outline: 3px solid #90b5ff; outline-offset: 3px; }
    main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 12px 12px; }
    .secondary { background: #fff; color: #263449; border: 1px solid #bdc9da; }
    .secondary:hover { background: #edf0f5; }
    #error { margin: 0 0 8px; padding: 8px 12px; border-left: 3px solid #b42318; background: #fff1f0; color: #912018; font-size: 14px; line-height: 1.6; }
    #drop-hint { position: fixed; inset: 12px; z-index: 3; display: grid; place-items: center; border: 2px dashed #285cce; border-radius: 8px; background: #edf4fff2; color: #214eaf; font-size: 20px; pointer-events: none; }
    body:not(.dragging) #drop-hint { display: none; }
    .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 0; max-width: 180px; margin-left: auto; color: #67758a; font-size: 12px; line-height: 1.3; }
    #filename { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #count { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .table-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #dfe5ed; border-radius: 6px; background: #fff; }
    .table-wrap { flex: 1; min-height: 0; overflow: auto; }
    .empty { height: 100%; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: #758296; font-size: 14px; }
    .empty strong { color: #3b4c64; font-size: 17px; font-weight: 500; }
    table { table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 14px; line-height: 1.5; }
    th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid #e9edf3; border-right: 1px solid #edf0f5; overflow-wrap: anywhere; white-space: pre-wrap; }
    th { position: sticky; top: 0; z-index: 1; background: #f0f4fa; color: #455975; font-weight: 600; box-shadow: 0 1px 0 #dfe5ed; }
    .column-heading { display: flex; align-items: flex-start; gap: 8px; }
    .column-label { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .resize-handle { position: absolute; top: 0; right: -1px; bottom: 0; width: 8px; cursor: col-resize; touch-action: none; }
    .resize-handle:hover, .resize-handle:focus-visible { background: #90b5ff66; outline: 0; }
    .sort-button:hover, .filter-button:hover { background: #e1e9f6; }
    .sort-mark { flex-shrink: 0; color: #67758a; font-size: 12px; }
    .sort-button, .filter-button { flex-shrink: 0; width: 24px; height: 24px; padding: 3px; background: transparent; color: #67758a; border-radius: 3px; }
    .filter-button[aria-pressed="true"], th[aria-sort]:not([aria-sort="none"]) .sort-mark { color: #285cce; }
    .filter-button[aria-pressed="true"] { background: #dae7ff; }
    #column-filter { position: fixed; inset: auto; margin: 0; width: min(300px, calc(100vw - 24px)); padding: 16px; border: 1px solid #bdc9da; border-radius: 8px; box-shadow: 0 6px 24px #26344926; color: #263449; background: #fff; font-size: 13px; }
    #column-filter h2 { margin: 0 0 14px; max-height: 84px; overflow: auto; font-size: 14px; overflow-wrap: anywhere; }
    .filter-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    #close-filter { flex-shrink: 0; height: 24px; padding: 0 6px; background: transparent; color: #67758a; }
    #column-filter label { display: block; margin: 12px 0 6px; }
    #column-filter input, #column-filter select { width: 100%; height: 34px; padding: 0 8px; border: 1px solid #bdc9da; border-radius: 5px; background: #fff; color: inherit; font: inherit; }
    #column-filter { max-height: calc(100dvh - 24px); overflow: auto; }
    #filter-options { max-height: 240px; overflow: auto; margin-top: 4px; }
    #column-filter .filter-option { display: flex; align-items: center; gap: 8px; min-height: 36px; margin: 0; padding: 6px 4px; border-radius: 4px; cursor: pointer; }
    #column-filter .filter-option:hover { background: #edf4ff; }
    #column-filter .filter-option input { width: 16px; height: 16px; padding: 0; flex-shrink: 0; accent-color: #285cce; }
    .filter-option span { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .filter-option small { margin-left: auto; padding-left: 8px; color: #67758a; font-variant-numeric: tabular-nums; }
    .filter-selection { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; color: #67758a; font-size: 12px; }
    #select-filter-values { height: 28px; padding: 0; background: transparent; color: #285cce; font-size: 12px; }
    #filter-error { margin: 8px 0 0; color: #b42318; }
    #active-filters, #filter-chips { display: flex; align-items: center; gap: 8px; }
    #active-filters { flex-shrink: 0; padding: 10px 12px; border-bottom: 1px solid #dfe5ed; background: #fff; }
    .filter-label { flex-shrink: 0; color: #67758a; font-size: 12px; }
    #filter-chips { flex: 1; min-width: 0; flex-wrap: wrap; }
    .filter-chip { max-width: 100%; height: auto; min-height: 30px; padding: 4px 8px; border: 1px solid #c5d8ff; background: #edf4ff; color: #285cce; font-size: 12px; font-weight: 400; }
    .filter-chip:hover { background: #dae7ff; }
    .filter-chip span { min-width: 0; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #clear-all-filters { flex-shrink: 0; margin-left: auto; height: 30px; padding: 0 4px; color: #67758a; background: transparent; font-size: 12px; font-weight: 400; }
    .filter-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:nth-child(even) { background: #fafbfd; }
    tbody tr:hover { background: #edf4ff; }
    tbody tr:last-child td { border-bottom: 0; }
    .no-rows { text-align: center; color: #758296; padding: 40px 18px; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) { header { flex-wrap: wrap; gap: 8px 12px; padding: 8px 12px; } .meta { max-width: 100%; flex-direction: row; gap: 8px; } }
    @media (max-width: 480px) { button { height: 44px; } main { padding: 6px 8px 8px; } th, td { padding: 8px 10px; } }
  </style>
</head>
<body>
  <header>
    <h1>JSON 表格</h1>
    <button id="import" class="secondary" type="button">选择文件…</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <button id="reset-view" class="secondary" type="button" hidden>重置排序</button>
    <div class="meta" role="status" aria-live="polite">
      <span id="filename">尚未打开文件</span>
      <span id="count"></span>
    </div>
  </header>
  <main>
    <div id="error" role="alert" hidden></div>
    <div class="table-panel">
      <div id="active-filters" aria-label="当前筛选" hidden>
        <span class="filter-label">已筛选</span>
        <div id="filter-chips"></div>
        <button id="clear-all-filters" type="button">清空筛选</button>
      </div>
      <div id="table-wrap" class="table-wrap" tabindex="0" role="region" aria-label="JSON 数据表格">
        <div id="empty" class="empty"><strong>打开 JSON 文件，查看表格</strong><span>点击「选择文件」，或直接将文件拖入页面</span><span>支持 columns / rows 格式，最大 20 MB</span></div>
        <table id="table" aria-label="导入的 JSON 数据" hidden></table>
      </div>
    </div>
  </main>
  <form id="column-filter" popover role="dialog" aria-labelledby="filter-title">
    <div class="filter-heading"><h2 id="filter-title"></h2><button id="close-filter" type="button" aria-label="关闭筛选">×</button></div>
    <div id="number-filter" hidden>
      <label for="number-mode">比较方式</label>
      <select id="number-mode">
        <option value="equals">等于</option>
        <option value="gte">大于等于</option>
        <option value="gt">大于</option>
        <option value="lte">小于等于</option>
        <option value="lt">小于</option>
        <option value="between">介于</option>
      </select>
    </div>
    <div id="filter-values" hidden>
      <label for="filter-search">搜索候选值</label>
      <input id="filter-search" type="search" autocomplete="off" placeholder="搜索候选值…">
      <div class="filter-selection"><button id="select-filter-values" type="button">全选搜索结果</button><span id="filter-selected" role="status" aria-live="polite"></span></div>
      <div id="filter-options"></div>
    </div>
    <label id="filter-value-label" for="filter-value">包含关键词（不区分大小写）</label>
    <input id="filter-value" type="text" autocomplete="off" placeholder="输入要查找的内容">
    <label id="filter-upper-label" for="filter-upper" hidden>最大值（含）</label>
    <input id="filter-upper" type="number" step="any" placeholder="输入最大值" hidden>
    <p id="filter-error" role="alert" hidden></p>
    <div class="filter-actions">
      <button id="clear-filter" class="secondary" type="button">清除此列</button>
      <button type="submit">应用筛选</button>
    </div>
  </form>
  <div id="drop-hint" aria-hidden="true">松开文件，立即导入</div>
  <script>
    const fileInput = document.getElementById('file');
    const importButton = document.getElementById('import');
    const table = document.getElementById('table');
    const errorBox = document.getElementById('error');
    const resetButton = document.getElementById('reset-view');
    const filterPanel = document.getElementById('column-filter');
    const numberMode = document.getElementById('number-mode');
    const filterValue = document.getElementById('filter-value');
    const filterUpper = document.getElementById('filter-upper');
    const filterSearch = document.getElementById('filter-search');
    const activeFilters = document.getElementById('active-filters');
    const filters = new Map();
    const headings = new Map();
    const columnState = new Map();
    const collator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
    let loadedData = null;
    let sort = null;
    let filterColumn = null;
    let filterTrigger = null;
    let draftValues = new Set();
    let loading = false;

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function validate(data) {
      if (!data || typeof data !== 'object' || Array.isArray(data) ||
          !Array.isArray(data.columns) || !Array.isArray(data.rows)) {
        throw new Error('JSON 必须是包含 columns 数组和 rows 数组的对象。');
      }
      if (!data.columns.length || data.columns.some(column => typeof column !== 'string' || !column.trim())) {
        throw new Error('columns 必须包含至少一个非空字符串列名。');
      }
      if (new Set(data.columns).size !== data.columns.length) {
        throw new Error('columns 中不能有重复列名。');
      }
      data.rows.forEach((row, index) => {
        if (!row || typeof row !== 'object' || Array.isArray(row) ||
            Object.keys(row).length !== data.columns.length ||
            data.columns.some(column => !Object.prototype.hasOwnProperty.call(row, column))) {
          throw new Error(`rows 的第 ${index + 1} 行必须是对象，且字段需与 columns 中的列名一致。`);
        }
      });
    }

    function cellText(value) {
      return typeof value === 'string' ? value : JSON.stringify(value);
    }

    function isEmpty(value) { return value === null || cellText(value).trim() === ''; }

    function valueKey(value) { return `${typeof value}:${JSON.stringify(value)}`; }

    function valueLabel(value) {
      if (value === null) return '（空值 · null）';
      if (value === '') return '（空字符串）';
      if (typeof value === 'boolean') return value ? '是 · true' : '否 · false';
      if (typeof value === 'number') return `${value} · 数字`;
      return value.trim() ? value : JSON.stringify(value);
    }

    function inspectColumn(column) {
      let numeric = true, hasNumber = false, selectable = true;
      const values = new Map();
      for (const row of loadedData.rows) {
        const value = row[column];
        if (value !== null) {
          numeric &&= typeof value === 'number';
          hasNumber ||= typeof value === 'number';
        }
        if (!selectable) continue;
        // Long text and high-cardinality columns are easier to filter by a condition.
        if ((value !== null && typeof value === 'object') || (typeof value === 'string' && value.length > 120)) selectable = false;
        else values.set(valueKey(value), value);
        if (values.size > 100) selectable = false;
        if (!selectable) values.clear();
      }
      return { numeric: numeric && hasNumber, values: selectable && values.size ? values : null };
    }

    function matchesFilters(row, omittedColumn) {
      for (const [column, condition] of filters) {
        if (column === omittedColumn) continue;
        const value = row[column];
        let matches;
        if (condition.mode === 'values') matches = condition.keys.has(valueKey(value));
        else if (typeof condition.value === 'number') {
          matches = typeof value === 'number' && (
            condition.mode === 'gte' ? value >= condition.value :
            condition.mode === 'gt' ? value > condition.value :
            condition.mode === 'lte' ? value <= condition.value :
            condition.mode === 'lt' ? value < condition.value :
            condition.mode === 'between' ? value >= condition.value && value <= condition.upper : value === condition.value);
        } else {
          const text = cellText(value).toLocaleLowerCase();
          const query = condition.value.toLocaleLowerCase();
          matches = text.includes(query);
        }
        if (!matches) return false;
      }
      return true;
    }

    function filterDescription(column, condition) {
      if (condition.mode === 'values') {
        const values = columnState.get(column).values;
        return Array.from(condition.keys, key => valueLabel(values.get(key))).join('、') || '未选择任何值';
      }
      if (condition.mode === 'between') return `${condition.value} ～ ${condition.upper}（含边界）`;
      const prefix = { contains: '包含 ', equals: '等于 ', gt: '> ', gte: '≥ ', lt: '< ', lte: '≤ ' };
      return prefix[condition.mode] + condition.value;
    }

    function textWidth(text) {
      return Array.from(text).reduce((width, char) => width + (char.codePointAt(0) > 255 ? 14 : 7), 0);
    }

    function estimateWidth(column, maximum = 360) {
      const widths = [];
      const count = Math.min(100, loadedData.rows.length);
      for (let i = 0; i < count; i++) {
        const row = loadedData.rows[Math.floor(i * loadedData.rows.length / count)];
        const lines = cellText(row[column]).slice(0, 512).split('\n');
        widths.push(Math.max(...lines.map(textWidth)));
      }
      widths.sort((a, b) => a - b);
      const content = widths[Math.floor((widths.length - 1) * .9)] || 0;
      return Math.min(maximum, Math.max(120, textWidth(column) + 88, content + 24));
    }

    function setColumnWidth(column, width) {
      columnState.get(column).width = Math.max(112, Math.min(1200, Math.round(width)));
      applyLayout();
    }

    function applyLayout() {
      table.style.width = `${loadedData.columns.reduce((sum, column) => sum + columnState.get(column).width, 0)}px`;
      for (const column of loadedData.columns) {
        const heading = headings.get(column);
        heading.cell.style.width = `${columnState.get(column).width}px`;
        heading.resizeHandle.setAttribute('aria-valuenow', String(Math.round(heading.cell.offsetWidth || columnState.get(column).width)));
      }
    }

    function addResizeHandle(column, cell) {
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.tabIndex = 0;
      handle.setAttribute('role', 'separator');
      handle.setAttribute('aria-orientation', 'vertical');
      handle.setAttribute('aria-label', `调整列宽：${column}`);
      handle.setAttribute('aria-valuemin', '112');
      handle.setAttribute('aria-valuemax', '1200');
      handle.title = '拖动调整列宽，双击适配内容；方向键也可调整';
      let drag = null;
      handle.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        drag = { x: event.clientX, width: cell.offsetWidth || columnState.get(column).width };
        handle.setPointerCapture(event.pointerId);
      });
      handle.addEventListener('pointermove', event => {
        if (drag) setColumnWidth(column, drag.width + event.clientX - drag.x);
      });
      const finish = () => { if (drag) { drag = null; updateView(); } };
      handle.addEventListener('pointerup', finish);
      handle.addEventListener('pointercancel', finish);
      handle.addEventListener('dblclick', () => { setColumnWidth(column, estimateWidth(column, 600)); updateView(); });
      handle.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'Home'].includes(event.key)) return;
        event.preventDefault();
        setColumnWidth(column, event.key === 'Home' ? estimateWidth(column) : (cell.offsetWidth || columnState.get(column).width) + (event.key === 'ArrowLeft' ? -20 : 20));
        updateView();
      });
      cell.append(handle);
      return handle;
    }

    function visibleRows() {
      const rows = loadedData.rows.filter(row => matchesFilters(row));
      if (sort) rows.sort((a, b) => {
        const left = a[sort.column], right = b[sort.column];
        if (isEmpty(left) || isEmpty(right)) return Number(isEmpty(left)) - Number(isEmpty(right));
        const comparison = typeof left === 'number' && typeof right === 'number' ? left - right : collator.compare(cellText(left), cellText(right));
        return sort.direction === 'ascending' ? comparison : -comparison;
      });
      return rows;
    }

    function cycleSort(column) {
      sort = sort?.column !== column ? { column, direction: 'ascending' } :
        sort.direction === 'ascending' ? { column, direction: 'descending' } : null;
      updateView();
    }

    function currentFilterMode() {
      const state = columnState.get(filterColumn);
      return state.numeric ? numberMode.value : state.values ? 'values' : 'contains';
    }

    function updateFilterInput() {
      const mode = currentFilterMode();
      const needsValue = mode !== 'values';
      const numeric = columnState.get(filterColumn).numeric;
      document.getElementById('number-filter').hidden = !numeric;
      numberMode.disabled = !numeric;
      document.getElementById('filter-values').hidden = mode !== 'values';
      filterValue.hidden = !needsValue;
      filterValue.disabled = !needsValue;
      filterValue.type = numeric ? 'number' : 'text';
      filterValue.step = 'any';
      filterValue.placeholder = numeric ? '输入数值' : '输入关键词…';
      document.getElementById('filter-value-label').textContent = mode === 'between' ? '最小值（含）' : numeric ? '筛选值' : '包含关键词（不区分大小写）';
      document.getElementById('filter-value-label').hidden = !needsValue;
      filterUpper.hidden = mode !== 'between';
      filterUpper.disabled = mode !== 'between';
      document.getElementById('filter-upper-label').hidden = mode !== 'between';
      document.getElementById('filter-error').hidden = true;
      if (mode === 'values') renderFilterOptions();
      positionFilter();
    }

    function positionFilter() {
      const rect = filterTrigger.getBoundingClientRect();
      filterPanel.style.left = `${Math.max(12, Math.min(rect.left, innerWidth - filterPanel.offsetWidth - 12))}px`;
      filterPanel.style.top = `${Math.max(12, Math.min(rect.bottom + 6, innerHeight - filterPanel.offsetHeight - 12))}px`;
    }

    function searchedValues() {
      const query = filterSearch.value.toLocaleLowerCase();
      return Array.from(columnState.get(filterColumn).values).filter(([, value]) => valueLabel(value).toLocaleLowerCase().includes(query));
    }

    function updateSelectionCount() {
      document.getElementById('filter-selected').textContent = `已选 ${draftValues.size} 项`;
      const shown = searchedValues();
      const selectAll = document.getElementById('select-filter-values');
      selectAll.disabled = !shown.length;
      selectAll.textContent = shown.length && shown.every(([key]) => draftValues.has(key)) ? '取消全选搜索结果' : '全选搜索结果';
    }

    function renderFilterOptions() {
      const options = document.getElementById('filter-options');
      options.replaceChildren();
      for (const [key, value] of searchedValues()) {
        const label = document.createElement('label');
        label.className = 'filter-option';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = draftValues.has(key);
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) draftValues.add(key);
          else draftValues.delete(key);
          updateSelectionCount();
        });
        const text = document.createElement('span');
        text.textContent = valueLabel(value);
        const count = document.createElement('small');
        count.textContent = String(facetCounts.get(key) || 0);
        label.append(checkbox, text, count);
        options.append(label);
      }
      if (!options.children.length) options.textContent = '没有匹配的候选值';
      updateSelectionCount();
    }

    let facetCounts = new Map();
    function openFilter(column, trigger) {
      if (filterTrigger) filterTrigger.setAttribute('aria-expanded', 'false');
      filterColumn = column;
      filterTrigger = trigger;
      const condition = filters.get(column);
      const state = columnState.get(column);
      if (state.numeric) numberMode.value = condition?.mode || 'gte';
      draftValues = new Set(condition?.mode === 'values' ? condition.keys : state.values?.keys());
      facetCounts = new Map();
      if (!state.numeric && state.values) for (const row of loadedData.rows) {
        if (!matchesFilters(row, column)) continue;
        const key = valueKey(row[column]);
        facetCounts.set(key, (facetCounts.get(key) || 0) + 1);
      }
      filterSearch.value = '';
      document.getElementById('filter-title').textContent = `筛选：${column}`;
      filterPanel.showPopover({ source: trigger });
      trigger.setAttribute('aria-expanded', 'true');
      updateFilterInput();
      filterValue.value = condition?.value ?? '';
      filterUpper.value = condition?.upper ?? '';
      (currentFilterMode() === 'values' ? filterSearch : filterValue).focus();
    }

    numberMode.addEventListener('change', updateFilterInput);
    filterSearch.addEventListener('input', renderFilterOptions);
    document.getElementById('select-filter-values').addEventListener('click', () => {
      const shown = searchedValues();
      const remove = shown.every(([key]) => draftValues.has(key));
      for (const [key] of shown) {
        if (remove) draftValues.delete(key);
        else draftValues.add(key);
      }
      renderFilterOptions();
    });
    document.getElementById('close-filter').addEventListener('click', () => {
      filterPanel.hidePopover();
      filterTrigger.focus();
    });
    filterPanel.addEventListener('toggle', event => {
      if (event.newState === 'closed' && filterTrigger) filterTrigger.setAttribute('aria-expanded', 'false');
    });
    filterPanel.addEventListener('submit', event => {
      event.preventDefault();
      const mode = currentFilterMode();
      let value = filterValue.value.trim();
      if (mode === 'values') {
        if (draftValues.size === columnState.get(filterColumn).values.size) filters.delete(filterColumn);
        else filters.set(filterColumn, { mode, keys: new Set(draftValues) });
      } else {
        const numeric = columnState.get(filterColumn).numeric;
        const upper = Number(filterUpper.value);
        if (numeric && (!value || !Number.isFinite(Number(value)) || (mode === 'between' && (!filterUpper.value.trim() || !Number.isFinite(upper) || upper < Number(value))))) {
          const error = document.getElementById('filter-error');
          error.textContent = mode === 'between' ? '请输入有效区间，最大值不能小于最小值。' : '请输入有效数值。';
          error.hidden = false;
          positionFilter();
          return;
        }
        if (mode === 'contains' && !value) filters.delete(filterColumn);
        else {
          if (numeric) value = Number(value);
          filters.set(filterColumn, { mode, value, ...(mode === 'between' ? { upper } : {}) });
        }
      }
      updateView();
      filterPanel.hidePopover();
      filterTrigger.focus();
    });
    document.getElementById('clear-filter').addEventListener('click', () => {
      filters.delete(filterColumn);
      updateView();
      filterPanel.hidePopover();
      filterTrigger.focus();
    });
    resetButton.addEventListener('click', () => {
      sort = null;
      filterPanel.hidePopover();
      updateView();
    });
    document.getElementById('clear-all-filters').addEventListener('click', () => {
      filters.clear();
      filterPanel.hidePopover();
      updateView();
    });

    function render(data) {
      loadedData = data;
      filters.clear();
      headings.clear();
      columnState.clear();
      sort = null;
      filterPanel.hidePopover();
      const head = document.createElement('thead');
      const headerRow = document.createElement('tr');
      for (const column of data.columns) {
        columnState.set(column, { width: estimateWidth(column), ...inspectColumn(column) });
        const cell = document.createElement('th');
        cell.scope = 'col';
        const heading = document.createElement('div');
        heading.className = 'column-heading';
        const sortButton = document.createElement('button');
        sortButton.type = 'button';
        sortButton.className = 'sort-button';
        const label = document.createElement('span');
        label.className = 'column-label';
        label.textContent = column;
        label.title = column;
        const mark = document.createElement('span');
        mark.className = 'sort-mark';
        mark.setAttribute('aria-hidden', 'true');
        sortButton.append(mark);
        sortButton.addEventListener('click', () => cycleSort(column));
        const filterButton = document.createElement('button');
        filterButton.type = 'button';
        filterButton.className = 'filter-button';
        filterButton.setAttribute('aria-label', `筛选：${column}`);
        filterButton.setAttribute('aria-haspopup', 'dialog');
        filterButton.setAttribute('aria-controls', 'column-filter');
        filterButton.setAttribute('aria-expanded', 'false');
        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('width', '16');
        icon.setAttribute('height', '16');
        icon.setAttribute('viewBox', '0 0 24 24');
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
        icon.setAttribute('stroke-width', '1.6');
        icon.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M4 5h16l-6 7v6l-4 2v-8z');
        icon.append(path);
        filterButton.append(icon);
        filterButton.addEventListener('click', () => openFilter(column, filterButton));
        heading.append(label, sortButton, filterButton);
        cell.append(heading);
        const resizeHandle = addResizeHandle(column, cell);
        headings.set(column, { cell, sortButton, mark, filterButton, resizeHandle });
        headerRow.append(cell);
      }
      head.append(headerRow);
      table.replaceChildren(head, document.createElement('tbody'));
      table.hidden = false;
      document.getElementById('empty').hidden = true;
      updateView();
    }

    function updateView() {
      const rows = visibleRows();
      const columns = loadedData.columns;
      for (const [column, heading] of headings) {
        const direction = sort?.column === column ? sort.direction : 'none';
        heading.cell.setAttribute('aria-sort', direction);
        heading.mark.textContent = direction === 'ascending' ? '↑' : direction === 'descending' ? '↓' : '↕';
        const next = direction === 'none' ? '升序排列' : direction === 'ascending' ? '降序排列' : '恢复原始顺序';
        heading.sortButton.setAttribute('aria-label', `${column}：${next}`);
        heading.sortButton.title = `点击${next}`;
        const condition = filters.get(column);
        heading.filterButton.setAttribute('aria-pressed', String(Boolean(condition)));
        heading.filterButton.title = condition ? `已筛选：${filterDescription(column, condition)}` : '筛选此列';
      }
      const chips = document.getElementById('filter-chips');
      chips.replaceChildren();
      for (const [column, condition] of filters) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'filter-chip';
        const description = `${column}：${filterDescription(column, condition)}`;
        chip.title = description;
        chip.setAttribute('aria-label', `移除筛选：${description}`);
        const text = document.createElement('span');
        text.textContent = description;
        const close = document.createElement('span');
        close.textContent = '×';
        close.setAttribute('aria-hidden', 'true');
        chip.append(text, close);
        chip.addEventListener('click', () => {
          filters.delete(column);
          filterPanel.hidePopover();
          updateView();
          headings.get(column).filterButton.focus();
        });
        chips.append(chip);
      }
      activeFilters.hidden = !filters.size;
      const body = document.createElement('tbody');
      for (const row of rows) {
        const tr = document.createElement('tr');
        for (const column of columns) {
          const cell = document.createElement('td');
          const text = cellText(row[column]);
          const content = document.createElement('div');
          content.className = 'cell-text';
          content.textContent = text;
          cell.append(content);
          tr.append(cell);
        }
        body.append(tr);
      }
      if (!rows.length) {
        const tr = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = columns.length;
        cell.className = 'no-rows';
        cell.textContent = filters.size ? '没有符合筛选条件的行，可修改条件或重置筛选。' : '暂无数据';
        tr.append(cell);
        body.append(tr);
      }
      table.tBodies[0].replaceWith(body);
      applyLayout();
      const total = loadedData.rows.length.toLocaleString();
      const columnCount = columns.length.toLocaleString();
      document.getElementById('count').textContent = `${filters.size ? `${rows.length.toLocaleString()} / ${total}` : total} 行 · ${columnCount} 列`;
      resetButton.hidden = !sort;
    }

    importButton.addEventListener('click', () => fileInput.click());
    async function importFile(file) {
      if (!file || loading) return;
      loading = true;
      errorBox.hidden = true;
      importButton.disabled = true;
      resetButton.disabled = true;
      table.inert = true;
      activeFilters.inert = true;
      filterPanel.hidePopover();
      const count = document.getElementById('count');
      const previousCount = count.textContent;
      count.textContent = '正在读取…';
      table.setAttribute('aria-busy', 'true');
      try {
        if (file.size > 20 * 1024 * 1024) throw new Error('文件超过 20 MB，请缩小文件后重试。');
        const text = (await file.text()).replace(/^\uFEFF/, '');
        let data;
        try { data = JSON.parse(text); }
        catch { throw new Error('文件不是有效的 JSON，请检查语法。'); }
        validate(data);
        render(data);
        document.getElementById('filename').textContent = file.name;
        document.getElementById('filename').title = file.name;
      } catch (error) {
        count.textContent = previousCount;
        showError(`导入失败：${error.message}${table.hidden ? '' : ' 当前表格仍保留上一次成功导入的数据。'}`);
      } finally {
        fileInput.value = '';
        loading = false;
        importButton.disabled = false;
        resetButton.disabled = false;
        table.inert = false;
        activeFilters.inert = false;
        table.setAttribute('aria-busy', 'false');
      }
    }
    fileInput.addEventListener('change', () => importFile(fileInput.files[0]));

    let dragDepth = 0;
    document.addEventListener('dragenter', event => {
      if (!Array.from(event.dataTransfer.types).includes('Files')) return;
      event.preventDefault();
      if (loading) return;
      dragDepth++;
      document.body.classList.add('dragging');
    });
    document.addEventListener('dragover', event => {
      if (!Array.from(event.dataTransfer.types).includes('Files')) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = loading ? 'none' : 'copy';
    });
    document.addEventListener('dragleave', event => {
      if (!Array.from(event.dataTransfer.types).includes('Files')) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) document.body.classList.remove('dragging');
    });
    document.addEventListener('drop', event => {
      dragDepth = 0;
      document.body.classList.remove('dragging');
      if (!Array.from(event.dataTransfer.types).includes('Files')) return;
      event.preventDefault();
      if (loading) return;
      if (event.dataTransfer.files.length !== 1) {
        showError('请每次拖入一个 JSON 文件。');
        return;
      }
      importFile(event.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
